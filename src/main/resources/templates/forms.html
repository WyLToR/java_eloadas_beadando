<!DOCTYPE HTML>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SOAP - MNB árfolyamok</title>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1, user-scalable=no"/>

    <link rel="stylesheet" href="/assets/css/main.css"/>
</head>

<body class="is-preload">
<div id="page-wrapper">

    <div id="header-wrapper">
        <header id="header" class="container">

            <div id="logo">
                <h1>
                    <a href="/">Java beadandó</a>
                </h1>
            </div>

            <nav id="nav">
                <ul>
                    <li>
                        <a href="/">Főoldal</a>
                    </li>

                    <li class="current">
                        <a href="/exercise">SOAP</a>
                    </li>

                    <li>
                        <a href="#">Forex</a>
                        <ul>
                            <li><a href="/account_info">Forex-account</a></li>
                            <li><a href="/actual_prices">Forex-AktÁr</a></li>
                            <li><a href="/hist_prices">Forex-HistÁr</a></li>
                            <li><a href="/open_position">Forex-Nyit</a></li>
                            <li><a href="/positions">Forex-Poz</a></li>
                            <li><a href="/close_position">Forex-Zár</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>

        </header>
    </div>
    <div id="main-wrapper">
        <div class="container">

            <div class="row">
                <div class="col-8 col-12-medium">

                    <section class="box">

                        <header>
                            <h2>MNB SOAP árfolyam lekérdezés</h2>
                        </header>

                        <form th:action="@{/exercise}"
                              th:object="${param}"
                              method="post">

                            <div class="row gtr-50">

                                <div class="col-12">
                                    <label>Deviza</label>

                                    <select th:field="*{currency}">
                                        <option value="EUR">EUR</option>
                                        <option value="USD">USD</option>
                                        <option value="GBP">GBP</option>
                                        <option value="JPY">JPY</option>
                                    </select>
                                </div>

                                <div class="col-6 col-12-small">
                                    <label>Kezdő dátum</label>

                                    <input type="date"
                                           th:field="*{startDate}">
                                </div>

                                <div class="col-6 col-12-small">
                                    <label>Befejező dátum</label>

                                    <input type="date"
                                           th:field="*{endDate}">
                                </div>

                                <div class="col-12">
                                    <input type="submit"
                                           value="Lekérdezés">
                                </div>

                            </div>

                        </form>

                    </section>

                </div>
            </div>

        </div>
    </div>
    <div id="footer-wrapper">
        <footer id="footer" class="container">

            <div id="copyright">
                <ul class="menu">
                    <li>
                        Készítette:
                    </li>
                    <li>
                        Békési Patrik Olivér - NLYG87
                    </li>
                    <li>

                    </li>
                    <li>
                        Lukács Norbert - KMUJGW
                    </li>
                    <li>

                    </li>
                    <li>
                        Design: HTML5 UP
                    </li>
                </ul>
            </div>

        </footer>
    </div>
</div>

<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/jquery.dropotron.min.js"></script>
<script src="/assets/js/browser.min.js"></script>
<script src="/assets/js/breakpoints.min.js"></script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/main.js"></script>

</body>
</html>
