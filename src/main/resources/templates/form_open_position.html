<!DOCTYPE HTML>
<html lang="hu"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Forex - Pozíció nyitás</title>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1, user-scalable=no"/>

    <link rel="stylesheet"
          href="/assets/css/main.css"/>
</head>

<body class="is-preload">

<div id="page-wrapper">
    <div id="header-wrapper">
        <header id="header" class="container">

            <div id="logo">
                <h1>
                    <a href="/exercise">SOAP</a>
                </h1>
            </div>

            <nav id="nav">
                <ul>
                    <li >
                        <a href="/">Főoldal</a>
                    </li>

                    <li>
                        <a href="/exercise">SOAP</a>
                    </li>

                    <li class="current">
                        <a href="#">Forex</a>
                        <ul>
                            <li>
                                <a href="/account_info">Forex-account</a>
                            </li>

                            <li>
                                <a href="/actual_prices">Forex-AktÁr</a>
                            </li>

                            <li>
                                <a href="/hist_prices">Forex-HistÁr</a>
                            </li>

                            <li>
                                <a href="/open_position">Forex-Nyit</a>
                            </li>

                            <li>
                                <a href="/positions">Forex-Poz</a>
                            </li>

                            <li>
                                <a href="/close_position">Forex-Zár</a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </nav>

        </header>
    </div>
    <div id="main-wrapper">
        <div class="container">

            <section class="box">

                <header>
                    <h2>Forex pozíció nyitás</h2>
                </header>

                <form th:action="@{/open_position}"
                      th:object="${param}"
                      method="post">

                    <label>Instrumentum</label>

                    <select th:field="*{instrument}">
                        <option value="EUR_USD">EUR_USD</option>
                        <option value="USD_CHF">USD_CHF</option>
                        <option value="GBP_USD">GBP_USD</option>
                        <option value="USD_JPY">USD_JPY</option>
                    </select>

                    <br>

                    <label>Mennyiség</label>

                    <input type="number"
                           min="-100"
                           max="100"
                           th:field="*{units}">

                    <p>
                        Pozitív érték: Long,
                        negatív érték: Short.
                    </p>

                    <input type="submit"
                           value="Pozíció nyitása">

                </form>

            </section>

        </div>
    </div>

</div>
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/jquery.dropotron.min.js"></script>
<script src="/assets/js/browser.min.js"></script>
<script src="/assets/js/breakpoints.min.js"></script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
